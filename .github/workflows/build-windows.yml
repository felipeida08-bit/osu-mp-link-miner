name: Build Windows

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executable:
    name: Gerar executavel
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Criar ambiente e instalar dependencias
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt

      - name: Gerar executavel
        shell: pwsh
        run: .\build.ps1

      - name: Gerar SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\osu-mp-link-miner.exe -Algorithm SHA256).Hash
          "$hash  osu-mp-link-miner.exe" | Set-Content .\dist\osu-mp-link-miner.exe.sha256

      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: osu-mp-link-miner-windows-${{ github.sha }}
          path: |
            dist/osu-mp-link-miner.exe
            dist/osu-mp-link-miner.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: executable
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar executavel validado
        uses: actions/download-artifact@v7
        with:
          name: osu-mp-link-miner-windows-${{ github.sha }}
          path: release

      - name: Criar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/osu-mp-link-miner.exe \
            release/osu-mp-link-miner.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes
